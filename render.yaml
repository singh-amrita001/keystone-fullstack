
services:
  - type: web
    name: keystone-backend
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DB_URL
        value: "jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/keystone?sslMode=VERIFY_IDENTITY"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

